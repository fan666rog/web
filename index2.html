<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fan666rog的展示區</title>
    <meta name="description" content="fan666rog的網頁應用程式、遊戲與 Windows 本機工具展示區，包含多種實用工具、BAT 腳本與趣味小遊戲。">
    <style>
        /* --- 載入動畫 --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0, 191, 255, 0.1);
            border-top-color: #00bfff; border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- 整體與深色主題變數 --- */
        :root {
            --primary-glow-color: #00bfff;
            --bat-glow-color: #00ff9d;
            --hud-accent: #00bfff;
            --hud-accent-soft: rgba(0, 191, 255, 0.25);
            --glass-bg: rgba(18, 20, 24, 0.78);
            --glass-bg-inactive: rgba(13, 14, 18, 0.94);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-cut: 22px;
            --card-cut-inner: 21px;
        }

        body {
            font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif;
            background-color: #030303; color: #e0e0e0; margin: 0; padding: 1.8rem 0 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }
        body.modal-open {
            overflow: hidden;
        }

        .container {
            width: 100%; max-width: 1200px; position: relative; z-index: 2;
            padding: 0 1rem; box-sizing: border-box; flex: 1;
        }

        /* --- 蜂巢動態背景 --- */
        #hex-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* ==========================================
           終極戰士風：無邊框懸浮全息燈管 (Predator Floating Hologram)
           ========================================== */
        header { text-align: center; margin-bottom: 1.6rem; display: flex; flex-direction: column; align-items: center; }

        .predator-panel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 1.2vw, 10px);
            padding: clamp(6px, 1.5vw, 12px) clamp(8px, 2vw, 16px);
            background: transparent;
            border: none;
            box-shadow: none;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.08s ease;
        }
        .predator-panel.panel-glitch { transform: translateX(2px); }

        .alien-digit {
            width: clamp(22px, 5.2vw, 42px);
            height: clamp(38px, 8.8vw, 72px);
            overflow: visible;
            display: block;
        }
        .alien-digit .seg {
            fill: rgba(0, 191, 255, 0.065);
            stroke: rgba(0, 191, 255, 0.03);
            stroke-width: 0.5px;
            transition: none;
        }
        .alien-digit .seg.on {
            fill: #00bfff;
            filter: drop-shadow(0 0 5px rgba(0, 191, 255, 0.95)) drop-shadow(0 0 12px rgba(0, 191, 255, 0.5));
        }
        .alien-digit .seg.surge {
            fill: #e0ffff;
            filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 16px #00bfff);
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        /* 圖例列 (對角微切角) */
        .legend-area {
            position: relative; z-index: 1;
            display: inline-flex; justify-content: center; align-items: center; flex-wrap: wrap;
            gap: 0.9rem; margin-top: 1rem; color: #8c96a4; font-size: 0.85rem;
            padding: 0.48rem 1.15rem;
            background: rgba(255, 255, 255, 0.11);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .legend-area::before {
            content: ""; position: absolute; inset: 1px; z-index: -1;
            background: rgba(10, 12, 16, 0.88);
            clip-path: polygon(0 0, calc(100% - 9.5px) 0, 100% 9.5px, 100% 100%, 9.5px 100%, 0 calc(100% - 9.5px));
        }
        .legend-item { display: inline-flex; align-items: center; gap: 0.4rem; }
        .legend-divider { width: 1px; height: 12px; background: rgba(255, 255, 255, 0.14); }
        .mobile-icon { width: 1.1rem; height: 1.1rem; fill: #00bfff; opacity: 0.85; flex-shrink: 0; }
        .terminal-icon { width: 1.1rem; height: 1.1rem; fill: #00ff9d; opacity: 0.9; flex-shrink: 0; }

        /* ==========================================
           分類篩選器 (對角切兩角戰術頁籤)
           ========================================== */
        .filter-container {
            display: flex; justify-content: center; gap: 0.75rem;
            margin-bottom: 1.2rem; flex-wrap: wrap;
        }
        .filter-btn {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.14);
            border: none; color: #a7b1be;
            padding: 0.58rem 1.25rem; font-size: 0.95rem; cursor: pointer;
            font-family: inherit; letter-spacing: 0.5px;
            clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 11px 100%, 0 calc(100% - 11px));
            transition: color 0.25s ease, background 0.25s ease, transform 0.2s ease;
        }
        .filter-btn::before {
            content: ""; position: absolute; inset: 1px; z-index: -1;
            background: rgba(11, 13, 18, 0.92);
            clip-path: polygon(0 0, calc(100% - 10.5px) 0, 100% 10.5px, 100% 100%, 10.5px 100%, 0 calc(100% - 10.5px));
            transition: background 0.25s ease;
        }
        .filter-btn .count-num { opacity: 0.8; font-size: 0.88em; margin-left: 2px; font-family: monospace; }
        .filter-btn:hover { color: #fff; background: rgba(0, 191, 255, 0.65); }
        .filter-btn:hover::before { background: rgba(10, 24, 34, 0.92); }

        .filter-btn.active {
            color: #fff; background: var(--primary-glow-color);
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.65);
        }
        .filter-btn.active::before { background: rgba(0, 56, 82, 0.78); }

        /* Win 本機分類專屬終端機綠高亮 */
        .filter-btn[data-filter="bat"]:hover { background: rgba(0, 255, 157, 0.65); }
        .filter-btn[data-filter="bat"]:hover::before { background: rgba(8, 30, 22, 0.92); }
        .filter-btn[data-filter="bat"].active {
            color: #e8fff5; background: var(--bat-glow-color);
            text-shadow: 0 0 8px rgba(0, 255, 157, 0.65);
        }
        .filter-btn[data-filter="bat"].active::before { background: rgba(0, 62, 40, 0.78); }

        /* ==========================================
           3D 虛擬弧形全息展台 (Holographic Arc Stage)
           ========================================== */
        .carousel-scene {
            width: 100%; height: 470px;
            perspective: 1200px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            margin: 0.4rem 0 0.8rem 0;
            overflow: hidden;
            user-select: none;
            touch-action: pan-y;
            cursor: grab;
        }
        .carousel-scene.dragging { cursor: grabbing; }

        .carousel-container {
            width: 326px; height: 420px;
            position: relative;
            transform-style: preserve-3d;
        }

        /* 卡片外層定位容器 (不套 clip-path，保留 3D 空間與外發光) */
        .project-card {
            --card-accent: #00bfff;
            --card-accent-rgb: 0, 191, 255;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            cursor: pointer;
        }
        .project-card[data-category="bat"] {
            --card-accent: #00ff9d;
            --card-accent-rgb: 0, 255, 157;
        }
        .project-card.active-front { cursor: default; }

        /* 層 1：內縮式柔和外發光層 (避免使用 filter: drop-shadow 破壞毛玻璃) */
        .card-aura {
            position: absolute; inset: 10px; z-index: 0; pointer-events: none;
            border-radius: 4px; opacity: 0;
            box-shadow: 0 0 34px 4px rgba(var(--card-accent-rgb), 0.34);
            transition: opacity 0.35s ease, box-shadow 0.35s ease;
        }
        .project-card.active-front .card-aura { opacity: 1; }
        .project-card.active-front:hover .card-aura {
            box-shadow: 0 0 46px 8px rgba(var(--card-accent-rgb), 0.46);
        }

        /* 層 2：對角切角邊框層 (承載完整 45° 斜邊與滑鼠探照燈邊框) */
        .card-frame {
            position: absolute; inset: 0; z-index: 1;
            clip-path: polygon(
                0 0,
                calc(100% - var(--card-cut)) 0,
                100% var(--card-cut),
                100% 100%,
                var(--card-cut) 100%,
                0 calc(100% - var(--card-cut))
            );
            background: rgba(255, 255, 255, 0.12);
            transition: background 0.35s ease;
        }
        .project-card.active-front .card-frame {
            background:
                radial-gradient(360px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--card-accent-rgb), 0.95), transparent 52%),
                rgba(var(--card-accent-rgb), 0.45);
        }

        /* 層 3：內縮切角內容層 (僅主角卡開啟 backdrop-filter 減輕手機 GPU 負擔) */
        .card-inner {
            position: absolute; inset: 1.5px; z-index: 2;
            padding: 1.5rem 1.65rem 1.65rem;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            background: var(--glass-bg-inactive);
            clip-path: polygon(
                0 0,
                calc(100% - var(--card-cut-inner)) 0,
                100% var(--card-cut-inner),
                100% 100%,
                var(--card-cut-inner) 100%,
                0 calc(100% - var(--card-cut-inner))
            );
            transition: background-color 0.35s ease;
        }
        .project-card.active-front .card-inner {
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        /* 卡片內部微光探照燈與頂部微飾條 */
        .card-inner::before {
            content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--card-accent-rgb), 0.11), transparent 45%);
            opacity: 0; transition: opacity 0.4s ease;
        }
        .project-card.active-front .card-inner::before { opacity: 0.7; }
        .project-card.active-front:hover .card-inner::before { opacity: 1; }

        .card-inner > * { position: relative; z-index: 1; }

        /* 卡片頂部戰術編號列 */
        .card-meta {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 0.75rem; padding-right: 0.5rem;
            font-family: monospace; font-size: 0.75rem; letter-spacing: 1.2px;
            color: rgba(var(--card-accent-rgb), 0.82);
        }
        .card-code {
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .card-code::before {
            content: ""; width: 6px; height: 6px;
            background: var(--card-accent);
            box-shadow: 0 0 8px var(--card-accent);
            display: inline-block;
        }
        .badge-group { display: inline-flex; align-items: center; gap: 0.35rem; }
        .badge-new {
            background: rgba(var(--card-accent-rgb), 0.18);
            border: 1px solid rgba(var(--card-accent-rgb), 0.7);
            color: #fff; font-weight: bold; font-size: 0.68rem;
            padding: 0.1rem 0.42rem; letter-spacing: 1px;
        }
        .badge-env {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #9aa5b4; font-size: 0.68rem;
            padding: 0.1rem 0.42rem;
        }

        .project-title {
            display: flex; align-items: center; justify-content: space-between; gap: 0.55rem;
            margin-bottom: 0.9rem; padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .project-card h2 {
            font-size: 1.32rem; margin: 0; color: #fff; font-weight: 600;
            letter-spacing: 0.8px; line-height: 1.35; transition: color 0.3s ease;
        }
        .project-card.active-front:hover h2 {
            color: var(--card-accent);
            text-shadow: 0 0 10px rgba(var(--card-accent-rgb), 0.45);
        }
        .project-card p {
            font-size: 0.93rem; color: #b4bcc8; flex-grow: 1;
            margin: 0 0 1.4rem; line-height: 1.65;
        }

        /* 卡片底部 CTA 按鈕 (平行對角切角) */
        .project-cta {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center; gap: 0.45rem;
            color: var(--card-accent);
            padding: 0.82rem 1.2rem;
            text-decoration: none; text-align: center;
            font-weight: bold; font-size: 0.95rem; letter-spacing: 1px;
            background: var(--card-accent);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            transition: color 0.25s ease, transform 0.2s ease;
            pointer-events: none;
        }
        .project-cta::before {
            content: ""; position: absolute; inset: 1.2px; z-index: -1;
            background: rgba(8, 12, 16, 0.92);
            clip-path: polygon(0 0, calc(100% - 11.4px) 0, 100% 11.4px, 100% 100%, 11.4px 100%, 0 calc(100% - 11.4px));
            transition: background 0.25s ease;
        }
        .project-card.active-front .project-cta { pointer-events: auto; }
        .project-card.active-front .project-cta:hover { color: #020508; }
        .project-card.active-front .project-cta:hover::before { background: var(--card-accent); }

        /* ==========================================
           拇指區戰術 HUD 導航列 (輪播正下方)
           ========================================== */
        .hud-wrapper {
            display: flex; justify-content: center;
            margin: 0.2rem 0 3rem;
        }
        .hud-bar {
            position: relative; z-index: 2;
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.32rem;
            background: rgba(255, 255, 255, 0.16);
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            transition: background 0.35s ease;
        }
        .hud-bar::before {
            content: ""; position: absolute; inset: 1px; z-index: -1;
            background: rgba(10, 13, 18, 0.92);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            clip-path: polygon(0 0, calc(100% - 13.5px) 0, 100% 13.5px, 100% 100%, 13.5px 100%, 0 calc(100% - 13.5px));
        }

        .hud-btn {
            position: relative; z-index: 1;
            background: transparent; border: none; color: #d2dbe6;
            height: 44px; min-width: 46px; padding: 0 0.9rem;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
            font-family: inherit; font-size: 0.92rem; cursor: pointer;
            clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
            transition: background 0.22s ease, color 0.22s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .hud-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }
        .hud-btn svg {
            width: 16px; height: 16px; fill: currentColor; flex-shrink: 0;
        }
        .hud-btn.disabled { opacity: 0.3; pointer-events: none; }

        .hud-divider {
            width: 1px; height: 22px; background: rgba(255, 255, 255, 0.12);
        }

        .hud-dir-btn {
            padding: 0 1.25rem;
            background: rgba(255, 255, 255, 0.04);
        }
        .hud-dir-btn:hover {
            background: var(--hud-accent-soft);
            color: #fff;
        }
        .hud-counter {
            font-family: monospace; font-size: 0.95rem; font-weight: bold;
            color: var(--hud-accent); letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .hud-sep { color: rgba(255, 255, 255, 0.25); font-size: 0.85rem; }
        .hud-dir-label { font-weight: 600; letter-spacing: 1px; white-space: nowrap; }

        /* ==========================================
           戰術快速目錄彈窗 (Tactical Directory Modal)
           ========================================== */
        .dir-modal {
            position: fixed; inset: 0; z-index: 5000;
            display: flex; justify-content: center; align-items: center;
            padding: 1.2rem; box-sizing: border-box;
            background: rgba(2, 4, 8, 0.78);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .dir-modal.open { opacity: 1; visibility: visible; }

        .dir-panel {
            position: relative; z-index: 1;
            width: 100%; max-width: 720px; max-height: 82vh;
            display: flex; flex-direction: column;
            background: rgba(0, 191, 255, 0.55);
            clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
            transform: translateY(16px) scale(0.98);
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .dir-modal.open .dir-panel { transform: translateY(0) scale(1); }

        .dir-panel-inner {
            position: relative; margin: 1.5px;
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            background: rgba(9, 12, 17, 0.96);
            clip-path: polygon(0 0, calc(100% - 21px) 0, 100% 21px, 100% 100%, 21px 100%, 0 calc(100% - 21px));
            overflow: hidden;
        }

        .dir-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.1rem 1.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 191, 255, 0.04);
        }
        .dir-title-wrap { display: flex; align-items: center; gap: 0.65rem; }
        .dir-title-dot {
            width: 8px; height: 8px; background: var(--primary-glow-color);
            box-shadow: 0 0 10px var(--primary-glow-color);
        }
        .dir-title {
            margin: 0; font-size: 1.05rem; letter-spacing: 1.5px; color: #fff;
        }
        .dir-total {
            font-family: monospace; font-size: 0.82rem; color: #7e8b9a;
        }

        .dir-close {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ccc; width: 36px; height: 36px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.2rem; line-height: 1;
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
            transition: all 0.2s ease;
        }
        .dir-close:hover {
            background: rgba(0, 191, 255, 0.22); border-color: var(--primary-glow-color); color: #fff;
        }

        .dir-body {
            padding: 1rem 1.35rem 1.4rem;
            overflow-y: auto; overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .dir-body::-webkit-scrollbar { width: 6px; }
        .dir-body::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .dir-body::-webkit-scrollbar-thumb { background: rgba(0, 191, 255, 0.35); }

        .dir-group { margin-bottom: 1.35rem; }
        .dir-group:last-child { margin-bottom: 0; }
        .dir-group-title {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.82rem; font-family: monospace; letter-spacing: 1.2px;
            color: #8b98a8; margin: 0 0 0.65rem; padding-bottom: 0.35rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .dir-group-title.is-bat { color: var(--bat-glow-color); border-bottom-color: rgba(0, 255, 157, 0.18); }

        .dir-grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem;
        }
        .dir-item {
            position: relative; z-index: 1;
            width: 100%; text-align: left; font-family: inherit;
            padding: 0.72rem 0.9rem; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1); color: #d8e0ea;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            transition: background 0.2s ease, color 0.2s ease;
        }
        .dir-item::before {
            content: ""; position: absolute; inset: 1px; z-index: -1;
            background: rgba(15, 18, 24, 0.95);
            clip-path: polygon(0 0, calc(100% - 9.5px) 0, 100% 9.5px, 100% 100%, 9.5px 100%, 0 calc(100% - 9.5px));
            transition: background 0.2s ease;
        }
        .dir-item:hover { background: var(--primary-glow-color); color: #fff; }
        .dir-item:hover::before { background: rgba(0, 44, 66, 0.88); }

        .dir-item.is-bat:hover { background: var(--bat-glow-color); color: #eafff6; }
        .dir-item.is-bat:hover::before { background: rgba(0, 50, 32, 0.88); }

        .dir-item.is-current { background: var(--primary-glow-color); color: #fff; }
        .dir-item.is-current::before { background: rgba(0, 58, 86, 0.9); }
        .dir-item.is-bat.is-current { background: var(--bat-glow-color); color: #eafff6; }
        .dir-item.is-bat.is-current::before { background: rgba(0, 64, 42, 0.9); }

        .dir-item-main {
            display: flex; flex-direction: column; gap: 0.18rem; min-width: 0;
        }
        .dir-item-name {
            font-size: 0.9rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dir-item-sub {

                setTimeout(() => { loader.style.display = 'none'; }, 350);
            }, 200);

            // ==========================================
            // 2. 終極戰士風：20 段式異形燈管電子錶引擎
            // ==========================================
            const titlePanel = document.getElementById('predator-title');
            const NUM_DIGITS = 9;

            const SEGMENT_POLYGONS = [
                "6,3 23,3 21,8 9,8", "27,3 44,3 41,8 29,8",
                "46,5 46,38 41,35 41,10", "46,42 46,75 41,70 41,45",
                "9,72 21,72 23,77 6,77", "29,72 41,72 44,77 27,77",
                "4,42 9,45 9,70 4,75", "4,5 9,10 9,35 4,38",
                "6,40 10,37 22,37 24,40 22,43 10,43", "26,40 28,37 40,37 44,40 40,43 28,43",
                "11,11 16,11 23,34 19,35", "23,9 27,9 27,35 23,35", "39,11 34,11 27,34 31,35",
                "19,45 23,46 16,69 11,69", "23,45 27,45 27,71 23,71", "27,46 31,45 39,69 34,69",
                "12,20 18,23 12,27", "38,20 32,23 38,27", "12,53 18,57 12,60", "38,53 32,57 38,60"
            ];

            const CHAR_MAP = {
                'F': [0, 1, 6, 7, 8, 9],
                'A': [0, 1, 2, 3, 6, 7, 8, 9],
                'N': [2, 3, 6, 7, 10, 15],
                '6': [0, 1, 3, 4, 5, 6, 7, 8, 9],
                'R': [0, 1, 2, 6, 7, 8, 9, 15],
                'O': [0, 1, 2, 3, 4, 5, 6, 7],
                'G': [0, 1, 3, 4, 5, 6, 7, 9],
                'W': [2, 3, 6, 7, 13, 15],
                'E': [0, 1, 4, 5, 6, 7, 8, 9],
                'L': [4, 5, 6, 7],
                'C': [0, 1, 4, 5, 6, 7],
                'M': [2, 3, 6, 7, 10, 12],
                '[': [0, 4, 16, 18],
                ']': [1, 5, 17, 19],
                ' ': []
            };

            const PREDATOR_GLYPHS = [
                [0, 4, 8, 10, 12, 15, 16, 19],
                [1, 2, 5, 9, 11, 13, 17, 18],
                [0, 1, 8, 11, 13, 15, 16, 17],
                [3, 4, 7, 9, 10, 14, 18, 19],
                [6, 8, 9, 10, 12, 13, 15, 17],
                [0, 5, 10, 11, 14, 15, 16, 19],
                [2, 6, 8, 12, 13, 16, 17, 18],
                [1, 4, 9, 10, 12, 14, 16, 19],
                [0, 3, 7, 8, 13, 15, 17, 18],
                [4, 5, 8, 9, 11, 16, 17, 18, 19]
            ];

            const digitElements = [];
            for (let d = 0; d < NUM_DIGITS; d++) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "0 0 50 80");
                svg.classList.add("alien-digit");
                const segNodes = [];
                SEGMENT_POLYGONS.forEach(pts => {
                    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    poly.setAttribute("points", pts);
                    poly.classList.add("seg");
                    svg.appendChild(poly);
                    segNodes.push(poly);
                });
                titlePanel.appendChild(svg);
                digitElements.push(segNodes);
            }

            function setDigitSegments(digitIdx, activeIndices, isSurge = false) {
                const segs = digitElements[digitIdx];
                if (!segs) return;
                for (let i = 0; i < segs.length; i++) segs[i].classList.remove('on', 'surge');
                for (let i = 0; i < activeIndices.length; i++) {
                    const idx = activeIndices[i];
                    if (segs[idx]) segs[idx].classList.add(isSurge ? 'surge' : 'on');
                }
            }

            function renderStringToPanel(str) {
                const padded = str.toUpperCase().padEnd(NUM_DIGITS, ' ');
                for (let i = 0; i < NUM_DIGITS; i++) {
                    setDigitSegments(i, CHAR_MAP[padded[i]] || []);
                }
            }

            function buildMorphFrames(alienSegs, targetSegs) {
                const alienOnly = alienSegs.filter(s => !targetSegs.includes(s));
                const targetOnly = targetSegs.filter(s => !alienSegs.includes(s));
                const shared = alienSegs.filter(s => targetSegs.includes(s));

                const keepAlien1 = alienOnly.filter((_, idx) => idx % 2 === 0);
                const addTarget1 = targetOnly.slice(0, Math.ceil(targetOnly.length * 0.35));
                const frameA = [...new Set([...shared, ...keepAlien1, ...addTarget1, 16 + (alienSegs[0] % 4)])];

                const keepAlien2 = alienOnly.slice(0, 1);
                const addTarget2 = targetOnly.slice(0, Math.ceil(targetOnly.length * 0.75));
                const frameB = [...new Set([...shared, ...keepAlien2, ...addTarget2])];

                return [frameA, frameB];
            }

            const STATE_FAN = 'FAN666ROG';
            const STATE_WELCOME = '[WELCOME]';
            let currentTitleState = STATE_FAN;
            let activeTimeouts = [];

            function clearDecodeTimeouts() {
                activeTimeouts.forEach(t => clearTimeout(t));
                activeTimeouts = [];
            }

            function triggerPredatorDecode(targetStr) {
                clearDecodeTimeouts();
                currentTitleState = targetStr;
                const paddedTarget = targetStr.toUpperCase().padEnd(NUM_DIGITS, ' ');

                titlePanel.classList.add('panel-glitch');
                activeTimeouts.push(setTimeout(() => titlePanel.classList.remove('panel-glitch'), 90));

                for (let i = 0; i < NUM_DIGITS; i++) {
                    const targetSegs = CHAR_MAP[paddedTarget[i]] || [];
                    const glyph1 = PREDATOR_GLYPHS[(i * 3 + Math.floor(Math.random() * 3)) % PREDATOR_GLYPHS.length];
                    const glyph2 = PREDATOR_GLYPHS[(i * 3 + 5) % PREDATOR_GLYPHS.length];
                    const [morphA, morphB] = buildMorphFrames(glyph2, targetSegs);

                    const enterDelay = i * 35 + Math.floor(Math.random() * 25);
                    const decodeBase = 480 + i * 75 + Math.floor(Math.random() * 35);

                    activeTimeouts.push(setTimeout(() => {
                        setDigitSegments(i, glyph1, true);
                        activeTimeouts.push(setTimeout(() => setDigitSegments(i, glyph1, false), 70));
                    }, enterDelay));

                    activeTimeouts.push(setTimeout(() => setDigitSegments(i, glyph2, false), decodeBase));
                    activeTimeouts.push(setTimeout(() => setDigitSegments(i, morphA, false), decodeBase + 210));
                    activeTimeouts.push(setTimeout(() => setDigitSegments(i, morphB, false), decodeBase + 430));

                    activeTimeouts.push(setTimeout(() => {
                        setDigitSegments(i, targetSegs, true);
                        if (i % 3 === 1) {
                            titlePanel.classList.add('panel-glitch');
                            activeTimeouts.push(setTimeout(() => titlePanel.classList.remove('panel-glitch'), 60));
                        }
                        activeTimeouts.push(setTimeout(() => setDigitSegments(i, targetSegs, false), 130));
                    }, decodeBase + 670));
                }
            }

            renderStringToPanel(STATE_FAN);
            setTimeout(() => triggerPredatorDecode(STATE_WELCOME), 1950);

            titlePanel.addEventListener('click', () => {
                const nextState = (currentTitleState === STATE_WELCOME) ? STATE_FAN : STATE_WELCOME;
                triggerPredatorDecode(nextState);
            });

            // ==========================================
            // 3. 動態渲染作品卡片與計數
            // ==========================================
            const carouselScene = document.getElementById('carousel-scene');
            const carousel = document.getElementById('portfolio-grid');
            const catCounters = { bat: 0, tool: 0, game: 0 };

            const allCards = PROJECTS.map((proj) => {
                catCounters[proj.category] = (catCounters[proj.category] || 0) + 1;
                const codePrefix = CATEGORY_META[proj.category]?.code || 'PRJ';
                const codeNum = String(catCounters[proj.category]).padStart(2, '0');

                const card = document.createElement('article');
                card.className = 'project-card';
                card.dataset.id = proj.id;
                card.dataset.category = proj.category;

                const iconHtml = proj.category === 'bat'
                    ? ICON_TERM_SVG
                    : (proj.mobile ? ICON_MOBILE_SVG : '');

                const badgesHtml = `
                    <div class="badge-group">
                        ${proj.isNew ? '<span class="badge-new">NEW</span>' : ''}
                        ${proj.envLabel ? `<span class="badge-env">${proj.envLabel}</span>` : ''}
                    </div>
                `;

                card.innerHTML = `
                    <div class="card-aura" aria-hidden="true"></div>
                    <div class="card-frame" aria-hidden="true"></div>
                    <div class="card-inner">
                        <div class="card-meta">
                            <span class="card-code">${codePrefix} // ${codeNum}</span>
                            ${badgesHtml}
                        </div>
                        <div class="project-title">
                            <h2>${proj.title}</h2>
                            ${iconHtml}
                        </div>
                        <p>${proj.desc}</p>
                        <a class="project-cta" href="${proj.url}" target="_blank" rel="noopener noreferrer">${proj.ctaText}</a>
                    </div>
                `;

                carousel.appendChild(card);
                return card;
            });

            // 更新分類按鈕數量
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const filter = btn.dataset.filter;
                const numSpan = btn.querySelector('.count-num');
                if (!numSpan) return;
                if (filter === 'all') numSpan.textContent = PROJECTS.length;
                else numSpan.textContent = PROJECTS.filter(p => p.category === filter).length;
            });

            // ==========================================
            // 4. 3D 虛擬弧形輪播引擎 (支援任意數量：1 / 2 / 13 / 50+ 均不破版)
            // ==========================================
            const hudBar = document.getElementById('hud-bar');
            const hudCounter = document.getElementById('hud-counter');
            const hudPrevBtn = document.getElementById('hud-prev');
            const hudNextBtn = document.getElementById('hud-next');

            let currentFilter = 'all';
            let visibleCards = [...allCards];
            let currentPos = 0;
            let targetPos = 0;
            let animFrameId = null;
            let isDragging = false;
            let hasInteracted = false;
            let dragDistance = 0;
            let startX = 0;
            let startPos = 0;
            let lastActiveCard = null;

            function getArcParams() {
                const isMobile = window.innerWidth <= 768;
                return {
                    radius: isMobile ? 380 : 540,
                    stepDeg: isMobile ? 36 : 32,
                    maxVisibleRange: isMobile ? 2.15 : 2.6,
                    dragDivisor: isMobile ? 210 : 270
                };
            }

            function getWrappedActiveIndex(pos, count) {
                if (count <= 0) return -1;
                if (count <= 2) return Math.max(0, Math.min(count - 1, Math.round(pos)));
                return ((Math.round(pos) % count) + count) % count;
            }

            function getRelativeOffset(index, pos, count) {
                if (count <= 1) return 0;
                if (count === 2) return index - pos;
                let diff = ((index - pos) % count + count) % count;
                if (diff > count / 2) diff -= count;
                return diff;
            }

            function syncHudState(activeIdx) {
                const count = visibleCards.length;
                const displayIdx = count > 0 ? String(activeIdx + 1).padStart(2, '0') : '00';
                const displayTotal = String(count).padStart(2, '0');
                hudCounter.textContent = `${displayIdx} / ${displayTotal}`;

                const disableNav = count <= 1;
                hudPrevBtn.classList.toggle('disabled', disableNav);
                hudNextBtn.classList.toggle('disabled', disableNav);

                const activeCard = visibleCards[activeIdx];
                const isBat = activeCard && activeCard.dataset.category === 'bat';
                const accent = isBat ? '#00ff9d' : '#00bfff';
                const accentSoft = isBat ? 'rgba(0, 255, 157, 0.22)' : 'rgba(0, 191, 255, 0.22)';
                document.documentElement.style.setProperty('--hud-accent', accent);
                document.documentElement.style.setProperty('--hud-accent-soft', accentSoft);
                hudBar.style.background = isBat ? 'rgba(0, 255, 157, 0.48)' : 'rgba(0, 191, 255, 0.42)';
            }

            function renderCarouselFrame() {
                const count = visibleCards.length;
                const { radius, stepDeg, maxVisibleRange } = getArcParams();
                const activeIdx = getWrappedActiveIndex(currentPos, count);

                // 先隱藏非目前分類的卡片
                allCards.forEach(card => {
                    if (!visibleCards.includes(card)) {
                        card.classList.remove('active-front');
                        card.style.opacity = '0';
                        card.style.visibility = 'hidden';
                        card.style.pointerEvents = 'none';
                        card.style.transform = 'translateZ(-400px) scale(0.6)';
                    }
                });

                visibleCards.forEach((card, i) => {
                    const rel = getRelativeOffset(i, currentPos, count);
                    const absRel = Math.abs(rel);

                    if (absRel > maxVisibleRange) {
                        card.classList.remove('active-front');
                        card.style.opacity = '0';
                        card.style.visibility = 'hidden';
                        card.style.pointerEvents = 'none';
                        return;
                    }

                    const angle = rel * stepDeg;
                    const scale = Math.max(0.72, 1 - absRel * 0.125);
                    let opacity;
                    if (absRel < 0.08) {
                        opacity = 1;
                    } else if (absRel <= 1) {
                        opacity = 1 - absRel * 0.56; // 1.0 -> 0.44
                    } else {
                        opacity = Math.max(0, 0.44 - (absRel - 1) * 0.28);
                    }

                    const isFront = (i === activeIdx && absRel < 0.5);
                    card.classList.toggle('active-front', isFront);
                    card.style.visibility = 'visible';
                    card.style.opacity = opacity.toFixed(3);
                    card.style.zIndex = String(100 - Math.round(absRel * 10));
                    card.style.pointerEvents = absRel <= 1.6 ? 'auto' : 'none';
                    card.style.transform = `translateZ(${-radius}px) rotateY(${angle.toFixed(2)}deg) translateZ(${radius}px) scale(${scale.toFixed(3)})`;
                });

                const currentActiveCard = visibleCards[activeIdx] || null;
                if (currentActiveCard !== lastActiveCard) {
                    lastActiveCard = currentActiveCard;
                    syncHudState(activeIdx);
                }
            }

            function startSpringLoop() {
                if (animFrameId !== null) return;
                const tick = () => {
                    if (isDragging) {
                        renderCarouselFrame();
                        animFrameId = requestAnimationFrame(tick);
                        return;
                    }

                    const diff = targetPos - currentPos;
                    if (Math.abs(diff) < 0.002) {
                        currentPos = targetPos;
                        // 靜止時把過大的累積偏移正規化，避免浮點數誤差
                        if (visibleCards.length >= 3 && Math.abs(currentPos) > visibleCards.length * 4) {
                            const norm = getWrappedActiveIndex(currentPos, visibleCards.length);
                            currentPos = norm;
                            targetPos = norm;
                        }
                        renderCarouselFrame();
                        animFrameId = null;
                        return;
                    }

                    currentPos += diff * 0.16;
                    renderCarouselFrame();
                    animFrameId = requestAnimationFrame(tick);
                };
                animFrameId = requestAnimationFrame(tick);
            }

            function stepCarousel(delta) {
                const count = visibleCards.length;
                if (count <= 1) return;
                hasInteracted = true;

                if (count === 2) {
                    const currentIdx = getWrappedActiveIndex(targetPos, 2);
                    targetPos = currentIdx === 0 ? 1 : 0;
                } else {
                    targetPos = Math.round(targetPos) + delta;
                }
                startSpringLoop();
            }

            // 進場微轉提示
            function playIntroNudge() {
                setTimeout(() => {
                    if (isDragging || hasInteracted || visibleCards.length <= 1) return;
                    targetPos = 0.36;
                    startSpringLoop();
                    setTimeout(() => {
                        if (isDragging || hasInteracted) return;
                        targetPos = 0;
                        startSpringLoop();
                    }, 560);
                }, 580);
            }

            // --- 指標拖曳與滑動 ---
            carouselScene.addEventListener('pointerdown', (e) => {
                if (visibleCards.length <= 1) return;
                hasInteracted = true;
                isDragging = true;
                dragDistance = 0;
                startX = e.clientX;
                startPos = currentPos;
                carouselScene.classList.add('dragging');
                startSpringLoop();
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                dragDistance = Math.max(dragDistance, Math.abs(dx));
                const { dragDivisor } = getArcParams();
                let nextPos = startPos - (dx / dragDivisor);

                // 僅 2 張卡時於邊界加上橡皮筋阻力
                if (visibleCards.length === 2) {
                    if (nextPos < 0) nextPos = nextPos * 0.3;
                    else if (nextPos > 1) nextPos = 1 + (nextPos - 1) * 0.3;
                }
                currentPos = nextPos;
            }, { passive: true });

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                carouselScene.classList.remove('dragging');

                const count = visibleCards.length;
                if (count === 2) {
                    // 輕撥超過 22% 就切換，手機手感更輕快
                    const delta = currentPos - startPos;
                    if (Math.abs(delta) > 0.22) {
                        targetPos = delta > 0 ? 1 : 0;
                    } else {
                        targetPos = Math.round(startPos);
                    }
                } else {
                    const delta = currentPos - startPos;
                    if (Math.abs(delta) > 0.18 && Math.abs(delta) < 0.5) {
                        targetPos = Math.round(startPos) + (delta > 0 ? 1 : -1);
                    } else {
                        targetPos = Math.round(currentPos);
                    }
                }
                startSpringLoop();
            }

            window.addEventListener('pointerup', endDrag);
            window.addEventListener('pointercancel', endDrag);
            window.addEventListener('lostpointercapture', endDrag);

            // 拖曳開始於按鈕時防止誤開連結；點擊側卡則自動轉至中央
            allCards.forEach(card => {
                const cta = card.querySelector('.project-cta');
                if (cta) {
                    cta.addEventListener('click', (e) => {
                        if (dragDistance > 8) e.preventDefault();
                    });
                }

                card.addEventListener('click', () => {
                    if (dragDistance > 8) return;
                    const idx = visibleCards.indexOf(card);
                    if (idx === -1 || card.classList.contains('active-front')) return;

                    hasInteracted = true;
                    const count = visibleCards.length;
                    if (count === 2) {
                        targetPos = idx;
                    } else {
                        const rel = getRelativeOffset(idx, Math.round(currentPos), count);
                        targetPos = Math.round(currentPos) + rel;
                    }
                    startSpringLoop();
                });
            });

            // 桌機版橫向滾輪支援（不攔截垂直頁面捲動）
            let wheelLock = false;
            carouselScene.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || Math.abs(e.deltaX) < 12) return;
                e.preventDefault();
                if (wheelLock) return;
                wheelLock = true;
                stepCarousel(e.deltaX > 0 ? 1 : -1);
                setTimeout(() => { wheelLock = false; }, 260);
            }, { passive: false });

            // 鍵盤左右鍵切換 & ESC 關閉目錄
            window.addEventListener('keydown', (e) => {
                if (dirModal.classList.contains('open')) {
                    if (e.key === 'Escape') closeDirectory();
                    return;
                }
                if (e.key === 'ArrowLeft') stepCarousel(-1);
                else if (e.key === 'ArrowRight') stepCarousel(1);
            });

            // HUD 左右按鈕
            hudPrevBtn.addEventListener('click', () => stepCarousel(-1));
            hudNextBtn.addEventListener('click', () => stepCarousel(1));

            // --- 分類切換邏輯 ---
            const filterBtns = document.querySelectorAll('.filter-btn');
            function applyFilter(filterValue, jumpToProjectId = null) {
                hasInteracted = true;
                currentFilter = filterValue;

                filterBtns.forEach(b => {
                    b.classList.toggle('active', b.dataset.filter === filterValue);
                });

                visibleCards = filterValue === 'all'
                    ? [...allCards]
                    : allCards.filter(card => card.dataset.category === filterValue);

                let nextIdx = 0;
                if (jumpToProjectId) {
                    const found = visibleCards.findIndex(c => c.dataset.id === jumpToProjectId);
                    if (found !== -1) nextIdx = found;
                }

                currentPos = nextIdx;
                targetPos = nextIdx;
                lastActiveCard = null;
                renderCarouselFrame();
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => applyFilter(btn.dataset.filter));
            });

            // ==========================================
            // 5. 戰術快速目錄彈窗 (Tactical Directory Modal)
            // ==========================================
            const dirModal = document.getElementById('dir-modal');
            const dirBody = document.getElementById('dir-body');
            const dirTotal = document.getElementById('dir-total');
            const dirOpenBtn = document.getElementById('hud-dir-open');
            const dirCloseBtn = document.getElementById('dir-close');

            function renderDirectoryList() {
                dirTotal.textContent = `TOTAL ${String(PROJECTS.length).padStart(2, '0')}`;
                const activeIdx = getWrappedActiveIndex(targetPos, visibleCards.length);
                const activeId = visibleCards[activeIdx] ? visibleCards[activeIdx].dataset.id : '';

                const groupOrder = ['bat', 'tool', 'game'];
                dirBody.innerHTML = '';

                groupOrder.forEach(catKey => {
                    const items = PROJECTS.filter(p => p.category === catKey);
                    if (items.length === 0) return;

                    const groupEl = document.createElement('section');
                    groupEl.className = 'dir-group';

                    const titleEl = document.createElement('h3');
                    titleEl.className = `dir-group-title ${catKey === 'bat' ? 'is-bat' : ''}`;
                    titleEl.textContent = `${CATEGORY_META[catKey].label} (${items.length})`;
                    groupEl.appendChild(titleEl);

                    const gridEl = document.createElement('div');
                    gridEl.className = 'dir-grid';

                    items.forEach(proj => {
                        const itemBtn = document.createElement('button');
                        itemBtn.type = 'button';
                        itemBtn.className = `dir-item ${catKey === 'bat' ? 'is-bat' : ''} ${proj.id === activeId ? 'is-current' : ''}`;

                        const subText = catKey === 'bat'
                            ? 'Windows 本機免安裝'
                            : (proj.mobile ? 'PC / 手機支援' : 'PC 專用');

                        itemBtn.innerHTML = `
                            <span class="dir-item-main">
                                <span class="dir-item-name">${proj.title}</span>
                                <span class="dir-item-sub">${subText}</span>
                            </span>
                            <span class="dir-item-tag">${proj.version}</span>
                        `;

                        itemBtn.addEventListener('click', () => {
                            jumpToProject(proj.id);
                            closeDirectory();
                        });

                        gridEl.appendChild(itemBtn);
                    });

                    groupEl.appendChild(gridEl);
                    dirBody.appendChild(groupEl);
                });
            }

            function jumpToProject(projectId) {
                hasInteracted = true;
                let idx = visibleCards.findIndex(c => c.dataset.id === projectId);

                // 若目標不在目前篩選分類中，自動切回「全部作品」並對準目標
                if (idx === -1) {
                    applyFilter('all', projectId);
                    return;
                }

                const count = visibleCards.length;
                if (count <= 2) {
                    targetPos = idx;
                } else {
                    const base = Math.round(currentPos);
                    const rel = getRelativeOffset(idx, base, count);
                    targetPos = base + rel;
                }
                startSpringLoop();
            }

            function openDirectory() {
                renderDirectoryList();
                dirModal.classList.add('open');
                document.body.classList.add('modal-open');
            }

            function closeDirectory() {
                dirModal.classList.remove('open');
                document.body.classList.remove('modal-open');
            }

            dirOpenBtn.addEventListener('click', openDirectory);
            dirCloseBtn.addEventListener('click', closeDirectory);
            dirModal.addEventListener('click', (e) => {
                if (e.target === dirModal) closeDirectory();
            });

            // 游標探照燈 (僅支援滑鼠游標裝置)
            if (window.matchMedia('(hover: hover)').matches) {
                allCards.forEach(card => {
                    card.addEventListener('mousemove', e => {
                        if (!card.classList.contains('active-front')) return;
                        const rect = card.getBoundingClientRect();
                        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                    }, { passive: true });
                });
            }

            // 啟動輪播初始畫面
            renderCarouselFrame();
            playIntroNudge();

            // ==========================================
            // 6. Canvas 蜂巢圖庫與電流背景系統
            // ==========================================
            const canvas = document.getElementById('hex-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            const hexRadius = 45;
            const gridColor = 'rgba(75, 85, 105, 0.6)';
            const meteorColor = '#00bfff';
            let lines = [];
            let meteors = [];
            let hexCenters = [];

            let mouseX = -1000;
            let mouseY = -1000;
            if (window.matchMedia('(hover: hover)').matches) {
                window.addEventListener('mousemove', (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                }, { passive: true });
            }

            let loadedImages = [];
            let imageHexes = [];
            const totalImages = 12;
            let bgLoadStarted = false;

            function getValidHexPool() {
                if (hexCenters.length === 0) return { left: [], right: [] };

                const scrollX = window.scrollX || window.pageXOffset || 0;
                const scrollY = window.scrollY || window.pageYOffset || 0;

                const getStaticBounds = (el, padX, padTop, padBottom) => {
                    if (!el) return { left: 0, right: 0, top: 0, bottom: 0 };
                    const b = el.getBoundingClientRect();
                    return {
                        left: b.left + scrollX - padX,
                        right: b.right + scrollX + padX,
                        top: b.top + scrollY - padTop,
                        bottom: b.bottom + scrollY + padBottom
                    };
                };

                const avoidRects = [
                    getStaticBounds(document.getElementById('main-header'), 30, 30, 30),
                    getStaticBounds(document.getElementById('filter-bar'), 30, 20, 20),
                    getStaticBounds(document.getElementById('carousel-scene'), 50, 40, 40),
                    getStaticBounds(document.getElementById('hud-bar'), 40, 24, 24),
                    getStaticBounds(document.getElementById('main-footer'), 30, 30, 50)
                ];

                const validCenters = hexCenters.filter(c => {
                    return !avoidRects.some(r =>
                        c.x > r.left && c.x < r.right && c.y > r.top && c.y < r.bottom
                    );
                });

                return {
                    left: validCenters.filter(c => c.x < width / 2).sort(() => 0.5 - Math.random()),
                    right: validCenters.filter(c => c.x >= width / 2).sort(() => 0.5 - Math.random())
                };
            }

            function placeSingleImageOnHex(imgObj) {
                if (window.innerWidth <= 768 || hexCenters.length === 0) return;
                const pools = getValidHexPool();
                const minDistanceSq = (hexRadius * 3.5) ** 2;

                const leftCount = imageHexes.filter(h => h.x < width / 2).length;
                const rightCount = imageHexes.length - leftCount;
                const primaryPool = leftCount <= rightCount ? pools.left : pools.right;
                const secondaryPool = leftCount <= rightCount ? pools.right : pools.left;
                const combinedPool = [...primaryPool, ...secondaryPool];

                for (let candidate of combinedPool) {
                    let tooClose = false;
                    for (let existing of imageHexes) {
                        const dx = candidate.x - existing.x;
                        const dy = candidate.y - existing.y;
                        if (dx * dx + dy * dy < minDistanceSq) {
                            tooClose = true;
                            break;
                        }
                    }
                    if (!tooClose) {
                        imageHexes.push({ img: imgObj, x: candidate.x, y: candidate.y, fadeAlpha: 0 });
                        return;
                    }
                }
            }

            function startBackgroundImagesIfNeeded() {
                if (bgLoadStarted || window.innerWidth <= 768) return;
                bgLoadStarted = true;
                setTimeout(() => {
                    for (let i = 0; i < totalImages; i++) {
                        const img = new Image();
                        img.decoding = 'async';
                        img.onload = () => {
                            loadedImages.push(img);
                            placeSingleImageOnHex(img);
                        };
                        img.src = `./hex-gallery/i${i}.jpg`;
                    }
                }, 400);
            }

            function reassignLoadedImages() {
                imageHexes = [];
                startBackgroundImagesIfNeeded();
                if (window.innerWidth <= 768) return;
                loadedImages.forEach(img => {
                    placeSingleImageOnHex(img);
                    if (imageHexes.length > 0) imageHexes[imageHexes.length - 1].fadeAlpha = 1;
                });
            }

            function getHexVertices(cx, cy, r) {
                const vertices = [];
                for (let i = 0; i < 6; i++) {
                    const angle_rad = Math.PI / 180 * (60 * i);
                    vertices.push({ x: cx + r * Math.cos(angle_rad), y: cy + r * Math.sin(angle_rad) });
                }
                return vertices;
            }

            function initHexGrid() {
                lines = [];
                hexCenters = [];
                const linesSet = new Set();
                const horizSpacing = hexRadius * 1.5;
                const vertSpacing = hexRadius * Math.sqrt(3);
                const cols = Math.ceil(width / horizSpacing) + 2;
                const rows = Math.ceil(height / vertSpacing) + 2;

                for (let q = -1; q <= cols; q++) {
                    for (let r = -1; r <= rows; r++) {
                        const cx = q * horizSpacing;
                        const cy = r * vertSpacing + (q % 2 !== 0 ? vertSpacing / 2 : 0);

                        const margin = hexRadius * 1.5;
                        if (cx > margin && cx < width - margin && cy > margin && cy < height - margin) {
                            hexCenters.push({ x: cx, y: cy });
                        }

                        const pts = getHexVertices(cx, cy, hexRadius);
                        for (let i = 0; i < 6; i++) {
                            const p1 = pts[i], p2 = pts[(i + 1) % 6];
                            if (p1.x > -50 && p1.x < width + 50 && p1.y > -50 && p1.y < height + 50) {
                                const kX1 = Math.round(p1.x * 10), kY1 = Math.round(p1.y * 10);
                                const kX2 = Math.round(p2.x * 10), kY2 = Math.round(p2.y * 10);
                                const key1 = `${kX1},${kY1}-${kX2},${kY2}`;
                                const key2 = `${kX2},${kY2}-${kX1},${kY1}`;
                                if (!linesSet.has(key1) && !linesSet.has(key2)) {
                                    lines.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y });
                                    linesSet.add(key1);
                                }
                            }
                        }
                    }
                }
            }

            function drawGrid() {
                ctx.clearRect(0, 0, width, height);

                if (window.innerWidth > 768 && imageHexes.length > 0) {
                    imageHexes.forEach(item => {
                        if (item.fadeAlpha < 1) item.fadeAlpha = Math.min(1, item.fadeAlpha + 0.03);
                        ctx.save();
                        ctx.beginPath();
                        const pts = getHexVertices(item.x, item.y, hexRadius - 2);
                        ctx.moveTo(pts[0].x, pts[0].y);
                        for (let i = 1; i < 6; i++) ctx.lineTo(pts[i].x, pts[i].y);
                        ctx.closePath();
                        ctx.clip();

                        const dx = mouseX - item.x;
                        const dy = mouseY - item.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const targetAlpha = (distance < hexRadius) ? 0.9 : 0.35;
                        ctx.globalAlpha = targetAlpha * item.fadeAlpha;

                        const imgSize = hexRadius * 2;
                        ctx.drawImage(item.img, item.x - hexRadius, item.y - hexRadius, imgSize, imgSize);
                        ctx.restore();
                    });
                }

                ctx.beginPath();
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 1;
                lines.forEach(line => {
                    ctx.moveTo(line.x1, line.y1);
                    ctx.lineTo(line.x2, line.y2);
                });
                ctx.stroke();
            }

            function spawnMeteor() {
                if (lines.length === 0) return;
                const line = lines[Math.floor(Math.random() * lines.length)];
                meteors.push({
                    x1: line.x1, y1: line.y1, x2: line.x2, y2: line.y2,
                    progress: 0, speed: 0.015 + Math.random() * 0.02,
                    length: 0.3 + Math.random() * 0.4
                });
            }

            function animateCanvas() {
                drawGrid();
                if (Math.random() < 0.08 && meteors.length < 25) spawnMeteor();
                ctx.lineCap = 'round';
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.progress += m.speed;
                    const tailP = Math.max(0, m.progress - m.length);
                    const headP = Math.min(1, m.progress);
                    const hX = m.x1 + (m.x2 - m.x1) * headP, hY = m.y1 + (m.y2 - m.y1) * headP;
                    const tX = m.x1 + (m.x2 - m.x1) * tailP, tY = m.y1 + (m.y2 - m.y1) * tailP;

                    const gradient = ctx.createLinearGradient(tX, tY, hX, hY);
                    gradient.addColorStop(0, 'rgba(0, 191, 255, 0)');
                    gradient.addColorStop(1, meteorColor);

                    ctx.beginPath();
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 6;
                    ctx.globalAlpha = 0.25;
                    ctx.moveTo(tX, tY); ctx.lineTo(hX, hY);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 2.2;
                    ctx.globalAlpha = 1;
                    ctx.moveTo(tX, tY); ctx.lineTo(hX, hY);
                    ctx.stroke();

                    if (m.progress - m.length > 1) meteors.splice(i, 1);
                }
                requestAnimationFrame(animateCanvas);
            }

            function handleResize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initHexGrid();
                reassignLoadedImages();
                renderCarouselFrame();
            }

            window.addEventListener('resize', handleResize);
            handleResize();
            animateCanvas();
        });
    </script>
</body>
</html>
